# Future controller deployment sketch only. For the implemented Release 0.1
# development and CI environment, use ../../compose.test.yml from the root.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: aghha
      POSTGRES_USER: aghha
      POSTGRES_PASSWORD: change-me
    volumes:
      - postgres-data:/var/lib/postgresql/data

  controller:
    image: ghcr.io/example/agh-ha-controller:latest
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://aghha:change-me@postgres:5432/aghha?sslmode=disable
      SESSION_SECRET: change-me
      CREDENTIAL_ENCRYPTION_KEY: change-me
    ports:
      - "8080:8080"

volumes:
  postgres-data:
