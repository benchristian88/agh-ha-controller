name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://aghha:aghha-ci@127.0.0.1:5432/aghha?sslmode=disable
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: aghha
          POSTGRES_USER: aghha
          POSTGRES_PASSWORD: aghha-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aghha -d aghha"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Check formatting
        run: make fmt-check
      - name: Lint and vet
        run: make lint
      - name: Test backend, migrations, and frontend
        run: make test
      - name: Race-test backend and migrations
        run: make test-race
      - name: Audit production frontend dependencies
        working-directory: web
        run: npm audit --omit=dev
      - name: Build release inputs
        run: make build
      - name: Validate production container definition
        run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: unused
          PUBLIC_BASE_URL: http://controller.example.test:8080
          SESSION_SECRET: c3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3M=
          CREDENTIAL_ENCRYPTION_KEY: MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
