name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://atlas_dns:atlas-dns-ci@127.0.0.1:5432/atlas_dns?sslmode=disable
      ATLAS_DNS_VERSION: 1.0.0
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: atlas_dns
          POSTGRES_USER: atlas_dns
          POSTGRES_PASSWORD: atlas-dns-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas_dns -d atlas_dns"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24.x"
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Check formatting
        run: make fmt-check
      - name: Lint and vet
        run: make lint
      - name: Test backend, migrations, and frontend
        run: make test
      - name: Race-test backend and migrations
        run: make test-race
      - name: Audit production frontend dependencies
        working-directory: web
        run: npm audit --omit=dev
      - name: Build release inputs
        run: make build
      - name: Validate production container definition
        run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: unused
          PUBLIC_BASE_URL: http://controller.example.test:8080
          SESSION_SECRET: c3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3M=
          CREDENTIAL_ENCRYPTION_KEY: MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
