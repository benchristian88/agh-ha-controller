name: agh-ha-controller

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aghha}
      POSTGRES_USER: ${POSTGRES_USER:-aghha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  controller:
    build:
      context: .
      args:
        VERSION: 0.1.1
        COMMIT: ${CONTROLLER_COMMIT:-git-checkout}
        BUILT_AT: ${CONTROLLER_BUILT_AT:-local}
    image: agh-ha-controller:0.1.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER:-aghha}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aghha}?sslmode=disable
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?set CREDENTIAL_ENCRYPTION_KEY in .env}
      SESSION_DURATION: ${SESSION_DURATION:-12h}
      NODE_HEALTH_INTERVAL: ${NODE_HEALTH_INTERVAL:-30s}
      NODE_REQUEST_TIMEOUT: ${NODE_REQUEST_TIMEOUT:-10s}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUTO_MIGRATE: "true"
      WEB_DIST_DIR: /usr/local/share/agh-ha-controller/web
    ports:
      - "${CONTROLLER_BIND_ADDRESS:-0.0.0.0}:${CONTROLLER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
