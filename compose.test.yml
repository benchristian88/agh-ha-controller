name: agh-ha-controller-test

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aghha
      POSTGRES_USER: aghha
      POSTGRES_PASSWORD: aghha-local-test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aghha -d aghha"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - test-postgres-data:/var/lib/postgresql/data

  agh-node-a:
    build:
      context: .
      dockerfile: packaging/docker/test-node.Dockerfile
    environment:
      LISTEN_ADDR: ":8080"
      NODE_USERNAME: agh-admin
      NODE_PASSWORD: node-secret-value
      NODE_VERSION: v0.107.65
      NODE_RUNNING: "true"
    ports:
      - "127.0.0.1:3101:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  agh-node-b:
    build:
      context: .
      dockerfile: packaging/docker/test-node.Dockerfile
    environment:
      LISTEN_ADDR: ":8080"
      NODE_USERNAME: agh-admin
      NODE_PASSWORD: node-secret-value
      NODE_VERSION: v0.107.65
      NODE_RUNNING: "true"
    ports:
      - "127.0.0.1:3102:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  test-postgres-data:
